name: Android CI
on:
  push: { branches: [main, "foundation/**"] }
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.14.3" }
      - name: Unit tests + debug build + lint
        run: gradle :app:testDebugUnitTest :app:assembleDebug :app:lintDebug --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: app/build/reports
# Releases are never published automatically; they require explicit maintainer approval.
