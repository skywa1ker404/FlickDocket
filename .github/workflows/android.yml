name: Android CI
on:
  push: { branches: [main, "foundation/**"] }
  pull_request:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - name: Accept Android SDK licenses (SDK is preinstalled on the runner)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.14.3" }
      - name: Unit tests, debug build, lint
        run: gradle :app:testDebugUnitTest :app:assembleDebug :app:lintDebug --stacktrace --console=plain 2>&1 | tee build.log; exit ${PIPESTATUS[0]}
      - name: Surface errors as annotations
        if: failure()
        run: |
          grep -E "^e: |error:|FAILED|What went wrong|Could not (resolve|find)|Unresolved|> .*(version|plugin)" build.log | sed 's/%/%25/g' | head -40 | while IFS= read -r l; do echo "::error::${l:0:400}"; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            build.log
            app/build/reports
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
# Releases are never published automatically; they require explicit maintainer approval.
